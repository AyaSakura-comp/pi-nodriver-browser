<!doctype html>
<html><head><meta charset="utf-8"><title>Live fixture</title></head>
<body>
<h1>Live fixture</h1>
<form action="/results.html" method="get"><input name="q" placeholder="Search products"><button>Search</button></form>
<label for="station">出發</label>
<select id="station"><option value="">請選擇出發車站</option><option>BR01 動物園</option><option>R10 台北車站</option><option>R28 淡水</option></select>
<div style="position:relative;width:200px">
  <button id="covered" onclick="document.getElementById('status').textContent='covered clicked'">Covered button</button>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.05)"></div>
</div>
<button onclick="alert('Saved!'); document.getElementById('status').textContent='after alert'">Save with alert</button>
<p id="status">idle</p>
<a href="/newtab.html" target="_blank">Open report in new tab</a>
<!-- Like some ad links: the tab opens on about:blank and is pointed at its page later. -->
<button onclick="const w = window.open('', '_blank'); setTimeout(() => { w.location.href = '/slow-report.html'; }, 1200)">Open scripted report</button>
<iframe src="/inner.html" title="inner frame" width="320" height="60"></iframe>
<ul id="lazy"></ul>
<script>
requestAnimationFrame(() => {
  for (let i = 1; i <= 3; i++) {
    const li = document.createElement('li');
    li.textContent = `Lazy item ${i} $${i * 100}`;
    document.getElementById('lazy').appendChild(li);
  }
});
</script>
<div role="button" tabindex="0" style="width:500px">
  <h2>Fixture console box</h2><p>$14,969 限量販售</p>
  <p>Delivery: 24h到貨, ships from the Taipei warehouse in one working day after payment is confirmed and the stock check is done</p>
  <button>Add to wishlist</button>
</div>
<div style="height:30px;overflow:hidden">
  <a href="#visible">Visible link</a>
  <div style="height:300px"></div>
  <a href="#clipped">Clipped hidden link</a>
</div>
</body></html>
