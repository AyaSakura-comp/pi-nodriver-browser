<!doctype html>
<html>
<body>
<label for="main-cpu">Main CPU</label>
<select id="main-cpu">
  <option value="">Choose a CPU</option>
  <option value="9800X3D">Wrong CPU with duplicate lookup value</option>
  <option value="9800x3d">AMD Ryzen 7 9800X3D</option>
</select>
<button id="reorder" onclick="mainCpu.insertBefore(mainCpu.options[2], mainCpu.options[1])">Reorder CPU options</button>
<label for="disabled-cpu">Disabled CPU</label>
<select id="disabled-cpu" disabled>
  <option>Secret disabled processor</option>
</select>
<fieldset disabled>
  <label for="fieldset-cpu">Fieldset-disabled CPU</label>
  <select id="fieldset-cpu"><option>Secret fieldset processor</option></select>
</fieldset>
<script>const mainCpu = document.querySelector('#main-cpu');</script>
</body>
</html>
