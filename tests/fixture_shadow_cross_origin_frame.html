<!doctype html>
<html>
<body style="margin:0">
<div id="host" style="display:block;width:300px;height:300px"></div>
<script>
  const root = document.querySelector('#host').attachShadow({mode: 'open'});
  const frame = document.createElement('iframe');
  frame.src = new URL(location.href).searchParams.get('src');
  frame.style.cssText = 'width:300px;height:300px;border:0';
  root.append(frame);
</script>
</body>
</html>
