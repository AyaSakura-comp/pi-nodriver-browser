name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m unittest discover -s tests -v

  browser-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
      - name: Run Chrome/Xvfb integration test
        env:
          RUN_BROWSER_INTEGRATION: "1"
          NODRIVER_PYTHON: ${{ github.workspace }}/.venv/bin/python
          PI_NODRIVER_NO_SANDBOX: "1"
        run: python3 -m unittest discover -s tests -p 'test_worker_integration.py' -v
