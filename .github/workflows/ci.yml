name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Some Python tests run TypeScript snippets with --experimental-strip-types.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: .venv/bin/python -m unittest discover -s tests -v

  browser-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - name: Real Chrome and Xvfb on local fixture pages
        env:
          PI_BROWSER_LIVE: "1"
        run: .venv/bin/python -m unittest tests.test_worker_live -v
