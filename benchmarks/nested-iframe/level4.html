<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>第四重結界：黃金工坊</title>
  <style>
    :root {
      --primary: #f59e0b;
      --bg: #1e1910;
      --card-bg: rgba(33, 27, 16, 0.95);
      --border: #f59e0b;
      --text: #f8fafc;
      --muted: #fcd34d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 14px;
      font-size: 14px;
    }
    .level-card {
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      background: var(--card-bg);
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.2);
    }
    .level-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(245, 158, 11, 0.3);
      padding-bottom: 6px;
    }
    .level-title {
      font-size: 15px;
      font-weight: 700;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background: rgba(245, 158, 11, 0.2);
      color: #fef08a;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .instructions {
      color: #e2e8f0;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.5;
    }
    .action-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 14px;
      color: #fef08a;
      user-select: none;
    }
    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #f59e0b;
      cursor: pointer;
    }
    button {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      border: none;
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.5);
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #475569;
      box-shadow: none;
      transform: none;
    }
    .status-box {
      font-size: 13px;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(0,0,0,0.3);
      margin-bottom: 12px;
    }
    .iframe-wrapper {
      margin-top: 10px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px dashed rgba(244, 63, 94, 0.6);
    }
    iframe {
      width: 100%;
      height: 250px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="level-card">
    <div class="level-header">
      <div class="level-title">⚡ 第四重結界：黃金工坊 (Golden Foundry)</div>
      <div class="badge">深度 Depth 4</div>
    </div>
    <div class="instructions">
      第四重考驗：請先勾選【解除安全防護】核取方塊，再點擊【啟動超載傳送】按鈕以解鎖最深層核心。
    </div>
    <div id="status-4" class="status-box">
      🔒 工坊防護待命中：等待第三重結界授權...
    </div>
    <div class="action-row">
      <label class="checkbox-label">
        <input type="checkbox" id="chk-safety-4" disabled>
        <span>解除安全防護</span>
      </label>
      <button id="btn-teleport-4" disabled>啟動超載傳送</button>
    </div>

    <!-- 內嵌第五重結界 -->
    <div class="iframe-wrapper">
      <iframe id="barrier-5" name="結界五" title="第五重結界" src="level5.html"></iframe>
    </div>
  </div>

  <script>
    const chk = document.getElementById('chk-safety-4');
    const btn = document.getElementById('btn-teleport-4');
    const statusBox = document.getElementById('status-4');
    const iframe5 = document.getElementById('barrier-5');

    function notifyParent(data) {
      window.parent.postMessage(data, '*');
      try {
        if (window.top && window.top !== window.parent) {
          window.top.postMessage(data, '*');
        }
      } catch (e) {}
    }

    function unlockLevel4() {
      chk.disabled = false;
      btn.disabled = false;
      statusBox.innerHTML = '⚡ 第三重已解鎖：請勾選【解除安全防護】並點擊【啟動超載傳送】！';
      statusBox.style.color = '#fde68a';
    }

    if (sessionStorage.getItem('level3_cleared') === 'true') {
      unlockLevel4();
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'LEVEL3_CLEARED') {
        sessionStorage.setItem('level3_cleared', 'true');
        unlockLevel4();
      }
    });

    btn.addEventListener('click', () => {
      if (!chk.checked) {
        statusBox.innerHTML = '⚠️ 警報：必須先勾選【解除安全防護】核取方塊才能啟動傳送！';
        statusBox.style.color = '#f87171';
        return;
      }
      chk.disabled = true;
      btn.disabled = true;
      btn.innerText = '傳送已啟動';
      statusBox.innerHTML = '✅ 安全防護已解除，傳送門已就緒！第五重指示：請點擊【終極核銷核心】按鈕以獲取終極 FLAG！';
      statusBox.style.color = '#38bdf8';

      sessionStorage.setItem('level4_cleared', 'true');
      iframe5.contentWindow.postMessage({ type: 'LEVEL4_CLEARED' }, '*');
      notifyParent({ type: 'LEVEL4_CLEARED', level: 4, message: '第四重結界已通關' });
    });
  </script>
</body>
</html>
